# Keeps this fork up to date with Supermedo/uncharted_pc: upstream's main is merged into this
# fork's main, which then builds a new release. The `upstream` branch is an exact copy of
# upstream's main. README.md is the fork's own: when both sides changed it, the fork's version is
# kept. Any other conflict opens a pull request from `upstream` to be resolved by hand.
name: Sync with upstream

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/Supermedo/uncharted_pc.git
          git fetch upstream main
          git push --force origin upstream/main:refs/heads/upstream
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo 'Already up to date.'; exit 0
          fi
          if ! git merge --no-edit -m 'Merge upstream Supermedo/uncharted_pc' upstream/main; then
            git checkout --ours README.md 2>/dev/null && git add README.md || true
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              git merge --abort
              if [ -z "$(gh pr list --head upstream --base main --state open --json number -q '.[].number')" ]; then
                gh pr create --head upstream --base main --title 'Upstream changes need a manual merge' \
                  --body 'Merging Supermedo/uncharted_pc into main conflicts. Resolve the conflicts in this pull request, then merge it.'
              fi
              exit 1
            fi
            git commit --no-edit
          fi
          git push origin HEAD:main
          gh workflow run build.yml --ref main
