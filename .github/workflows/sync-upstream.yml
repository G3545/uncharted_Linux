# Keeps this fork up to date with Supermedo/uncharted_pc: main mirrors upstream's main, and
# upstream's changes are merged into steamdeck (the Linux branch), which then builds a release.
# A merge that conflicts opens a pull request instead, to be resolved by hand.
name: Sync with upstream

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: steamdeck
          fetch-depth: 0
      - name: Merge upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/Supermedo/uncharted_pc.git
          git fetch upstream main
          git push origin upstream/main:refs/heads/main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo 'Already up to date.'; exit 0
          fi
          if git merge --no-edit -m 'Merge upstream Supermedo/uncharted_pc' upstream/main; then
            git push origin HEAD:steamdeck
            gh workflow run build.yml --ref steamdeck
          else
            git merge --abort
            if [ -z "$(gh pr list --head main --base steamdeck --state open --json number -q '.[].number')" ]; then
              gh pr create --head main --base steamdeck --title 'Upstream changes need a manual merge' \
                --body 'Merging Supermedo/uncharted_pc main into steamdeck conflicts. Resolve the conflicts in this pull request, then merge it.'
            fi
            exit 1
          fi
